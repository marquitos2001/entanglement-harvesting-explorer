name: keep streamlit alive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -L --fail --max-time 30 https://entanglement-harvesting-explorer.streamlit.app/
          curl -L --fail --max-time 30 https://entanglement-harvesting-explorer.streamlit.app/_stcore/health
