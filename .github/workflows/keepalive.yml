name: keep streamlit alive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --max-redirs 3 --max-time 30 \
            https://entanglement-harvesting-explorer.streamlit.app/_stcore/health
